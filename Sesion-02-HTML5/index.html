<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Recetas Chapinas</title>
</head>
<body>
    <header>
        <h1>Recetas Chapinas</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="recetas.html">Recetas</a></li>
                <li><a href="acerca.html">Acerca de</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Bienvenido a nuestro recetario</h2>
            <article>
                <h3>La gastronomía guatemalteca</h3>
                <p>Descubre los mejores platillos de Guatemala.</p>
                
                <button commandfor="dialog-id" command="show-modal">Abrir Dialogo</button>
                <dialog id="dialog-id">
                    <p>Este es un dialog nativo.</p>
                    <button commandfor="dialog-id" command="close">Cerrar</button>
                </dialog>

                <button popovertarget="my-popover">Mostrar Popover</button>
                <div id="my-popover" popover>
                    Contenido del popover nativo.
                </div>

                <form action="#" method="post">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required>
                    <button type="submit">Enviar</button>
                </form>
            </article>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Recetas Chapinas</p>
    </footer>
</body>
</html>
