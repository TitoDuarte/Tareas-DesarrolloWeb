<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recetario de comida tradicional guatemalteca">
  <title>Contacto - Recetas Chapinas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header>
    <h1>Recetas Chapinas</h1>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="recetas.html">Recetas</a></li>
        <li><a href="acerca.html">Acerca de</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
        <li><a href="https://es.wikipedia.org/wiki/Gastronom%C3%ADa_de_Guatemala" target="_blank" rel="noopener noreferrer">Gastronomía (Wikipedia)</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido">
    <section>
      <h2>Contáctanos</h2>
      <article>
        <h3>Envíanos un mensaje</h3>
        <form action="#" method="post">
          <label for="c-nombre">Nombre:</label>
          <input type="text" id="c-nombre" name="nombre" required minlength="2" autocomplete="name">
          <label for="c-correo">Correo electrónico:</label>
          <input type="email" id="c-correo" name="correo" required autocomplete="email">
          <label for="c-tema">Tema:</label>
          <select id="c-tema" name="tema" required>
            <option value="">Selecciona uno</option>
            <option>Receta nueva</option>
            <option>Sugerencia</option>
            <option>Otro</option>
          </select>
          <label for="c-mensaje">Mensaje:</label>
          <textarea id="c-mensaje" name="mensaje" rows="4" required maxlength="500"></textarea>
          <button type="submit">Enviar</button>
        </form>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Recetas Chapinas &middot; Universidad Mariano Gálvez</p>
  </footer>
</body>
</html>
